<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="210" viewBox="0 0 1120 210" fill="none">
  <style>
    .label { font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #7d8590; font-weight: bold; letter-spacing: 1; }
    .badge-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #c9d1d9; font-weight: 500; }
  </style>
  <rect width="1120" height="210" rx="16" fill="#0b0d13" />
  <rect width="1118" height="208" x="1" y="1" rx="15" stroke="#21262d" stroke-width="2" />

  <!-- Languages -->
  <text x="40" y="45" class="label">LANGUAGES</text>
  <g transform="translate(160, 28)">
    <rect width="70" height="28" class="badge-bg"/><text x="12" y="18" class="badge-text">Python</text>
    <rect x="80" width="95" height="28" class="badge-bg"/><text x="92" y="18" class="badge-text">TypeScript</text>
    <rect x="185" width="90" height="28" class="badge-bg"/><text x="197" y="18" class="badge-text">JavaScript</text>
    <rect x="285" width="55" height="28" class="badge-bg"/><text x="297" y="18" class="badge-text">SQL</text>
    <rect x="350" width="60" height="28" class="badge-bg"/><text x="362" y="18" class="badge-text">Java</text>
  </g>

  <!-- AI & GenAI -->
  <text x="40" y="95" class="label">AI &amp; GENAI</text>
  <g transform="translate(160, 78)">
    <rect width="85" height="28" class="badge-bg"/><text x="12" y="18" class="badge-text">Gemini AI</text>
    <rect x="95" width="90" height="28" class="badge-bg"/><text x="107" y="18" class="badge-text">LangChain</text>
    <rect x="195" width="95" height="28" class="badge-bg"/><text x="207" y="18" class="badge-text">ChromaDB</text>
    <rect x="300" width="55" height="28" class="badge-bg"/><text x="312" y="18" class="badge-text">RAG</text>
    <rect x="365" width="90" height="28" class="badge-bg"/><text x="377" y="18" class="badge-text">scikit-learn</text>
  </g>

  <!-- Optimization & Verification -->
  <text x="40" y="145" class="label">ENGINEERING</text>
  <g transform="translate(160, 128)">
    <rect width="80" height="28" class="badge-bg"/><text x="12" y="18" class="badge-text">OR-Tools</text>
    <rect x="90" width="70" height="28" class="badge-bg"/><text x="102" y="18" class="badge-text">CP-SAT</text>
    <rect x="170" width="65" height="28" class="badge-bg"/><text x="182" y="18" class="badge-text">mCRL2</text>
    <rect x="245" width="70" height="28" class="badge-bg"/><text x="257" y="18" class="badge-text">UPPAAL</text>
  </g>
</svg>