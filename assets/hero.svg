<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" fill="none">
  <style>
    .terminal-text { font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; }
    .sans-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .fade-in { animation: fadeIn 1s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect width="1120" height="270" rx="16" fill="#0b0d13" />
  <rect width="1118" height="268" x="1" y="1" rx="15" stroke="#21262d" stroke-width="2" />
  
  <!-- Subtle decorative grid in background -->
  <path d="M 0,40 L 1120,40 M 0,80 L 1120,80 M 0,120 L 1120,120 M 0,160 L 1120,160 M 0,200 L 1120,200 M 0,240 L 1120,240" stroke="#1f242c" stroke-width="0.5" stroke-dasharray="4, 4" />
  <path d="M 100,0 L 100,270 M 200,0 L 200,270 M 300,0 L 300,270 M 400,0 L 400,270 M 500,0 L 500,270 M 600,0 L 600,270 M 700,0 L 700,270 M 800,0 L 800,270 M 900,0 L 900,270 M 1000,0 L 1000,270" stroke="#1f242c" stroke-width="0.5" stroke-dasharray="4, 4" />

  <!-- Accent glow -->
  <circle cx="1000" cy="50" r="120" fill="radial-gradient(circle, rgba(16,185,129,0.15) 0%, rgba(16,185,129,0) 70%)" />
  <circle cx="100" cy="220" r="100" fill="radial-gradient(circle, rgba(168,85,247,0.15) 0%, rgba(168,85,247,0) 70%)" />

  <!-- Terminal Top Bar -->
  <circle cx="25" cy="25" r="6" fill="#ff5f56" />
  <circle cx="45" cy="25" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="25" r="6" fill="#27c93f" />

  <text x="95" y="29" class="terminal-text" font-size="12" fill="#7d8590" letter-spacing="1.5">PRANJUL CHAURASIYA / PORTFOLIO</text>
  <line x1="15" y1="45" x2="1105" y2="45" stroke="#21262d" stroke-width="1.5" />

  <!-- Content -->
  <g class="fade-in">
    <text x="50" y="85" class="terminal-text" font-size="13" fill="#10b981" font-weight="bold">$ whoami</text>
    
    <text x="50" y="150" class="sans-text" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">Pranjul Chaurasiya</text>
    
    <text x="50" y="195" class="sans-text" font-size="20" font-weight="500" fill="#9ea7b3">
      AI Engineer &amp; Constraint Optimization Specialist
    </text>
    
    <text x="50" y="235" class="terminal-text" font-size="13" fill="#a855f7">&gt; "I build AI systems that solve real constraint problems — not demos."</text>
  </g>
</svg>
