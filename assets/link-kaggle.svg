<svg xmlns="http://www.w3.org/2000/svg" width="300" height="50" viewBox="0 0 300 50" fill="none">
  <style>
    .btn-bg { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8; transition: fill 0.2s; }
    .btn-bg:hover { fill: #21262d; stroke: #8b5cf6; }
    .btn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #c9d1d9; font-weight: bold; }
    .accent { fill: #10b981; }
  </style>

  <rect width="298" height="48" x="1" y="1" class="btn-bg"/>
  <text x="25" y="29" class="btn-text">📊 KAGGLE</text>
  <circle cx="270" cy="25" r="4" class="accent"/>
</svg>